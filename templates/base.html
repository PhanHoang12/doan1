{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>{% block title %}E-Shopper{% endblock %}</title>
    <link href="{% static 'global/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/font-awesome.min.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/prettyPhoto.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/price-range.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/animate.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/main.css' %}" rel="stylesheet">
    <link href="{% static 'global/css/responsive.css' %}" rel="stylesheet">
    {% block styles %} {% endblock %}
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <script src="js/respond.min.js"></script>
    <![endif]-->
    <link rel="shortcut icon" href="{% static 'global/images/ico/favicon.ico' %}">
    <link rel="apple-touch-icon-precomposed" sizes="144x144"
        href="{% static 'global/images/ico/apple-touch-icon-144-precomposed.png' %}">

    <link rel="apple-touch-icon-precomposed" sizes="114x114"
        href="{% static 'global/images/ico/apple-touch-icon-114-precomposed.png' %}">

    <link rel="apple-touch-icon-precomposed" sizes="72x72"
        href="{% static 'global/images/ico/apple-touch-icon-72-precomposed.png' %}">

    <link rel="apple-touch-icon-precomposed"
        href="{% static 'global/images/ico/apple-touch-icon-57-precomposed.png' %}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head><!--/head-->

<body>
    {% include "header.html" %}

    <section>
        <div class="container">
            <div class="row">

                <!-- Menu trái -->
                <div class="col-sm-3">
                    {% include "menu-left.html" %}
                </div>

                <!-- Nội dung từng trang -->
                <div class="col-sm-9">
                    {% block content %}
                    {% endblock %}
                </div>

            </div>
        </div>
    </section>
    {% include 'footer.html' %}

    <script src="{% static 'global/js/jquery.js' %}"></script>
    <script src="{% static 'global/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'global/js/jquery.scrollUp.min.js' %}"></script>
    <script src="{% static 'global/js/price-range.js' %}"></script>
    <script src="{% static 'global/js/jquery.prettyPhoto.js' %}"></script>
    <script src="{% static 'global/js/main.js' %}"></script>
    {%block scripts %} {% endblock%}
</body>

</html>
