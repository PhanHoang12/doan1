{% for product in products %}

<div class="col-sm-4">

    <div class="product-image-wrapper">

        <div class="single-products">

            <div class="productinfo text-center">

                {% if product.image_filenames %}

                <img src="/media/{{ product.image_filenames.0 }}" alt="{{ product.name }}" style="
                        width: 100%;
                        height: 220px;
                        object-fit: contain;
                    ">

                {% endif %}

                <h2>
                    {{ product.price }}
                </h2>

                <p>
                    {{ product.name }}
                </p>

                <p>
                    Status: {{ product.status }}
                </p>

            </div>

        </div>

    </div>

</div>

{% empty %}

<div class="col-sm-12">

    <p class="text-center">
        No products found
    </p>

</div>

{% endfor %}
