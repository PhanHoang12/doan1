{% extends "base.html" %}

{% block title %}
Đăng nhập
{% endblock %}

{% block content %}

<section id="form">
    <div class="container">
        <div class="row">
            <div class="col-sm-4 col-sm-offset-4">
                <div class="login-form">
                    <h2 class="text-center">
                        Login to your account
                    </h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-default" style="width:100%; margin-bottom:15px;">
                            Login
                        </button>
                    </form>
                    <div class="text-center">

                        <a href="{% url 'forgot_password' %}" style="
                                display:block;
                                margin-bottom:10px;
                                color:#FE980F;">
                            Forgot Password?
                        </a>
                        <p>
                            Don't have an account?
                        </p>
                        <a href="{% url 'register_view' %}" class="btn btn-default" style="width:100%;">
                            Register
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
