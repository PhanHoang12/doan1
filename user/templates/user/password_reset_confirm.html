{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<section id="form">
    <div class="container">

        <div class="col-sm-4 col-sm-offset-4">

            <div class="login-form">

                <h2>New Password</h2>

                {% if validlink %}

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-default">
                        Change Password
                    </button>

                </form>

                {% else %}

                <p>
                    Link reset password không hợp lệ hoặc đã hết hạn.
                </p>

                {% endif %}

            </div>

        </div>

    </div>
</section>

{% endblock %}
