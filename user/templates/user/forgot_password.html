{% extends "base.html" %}
{% load static %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<section id="form">
    <div class="container">

        <div class="row">

            <div class="col-sm-4 col-sm-offset-4">

                <div class="login-form">

                    <h2>Forgot Password</h2>

                    <form method="POST">

                        {% csrf_token %}

                        <input type="email" name="email" placeholder="Enter your email" required>

                        <button type="submit" class="btn btn-default">
                            Confirm
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
</section>
{% endblock %}
